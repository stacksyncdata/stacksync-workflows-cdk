# stacksync.yml — the connector's configuration.
#
# App-level settings only. Modules are discovered automatically from the
# modules/ folder (modules/<name>/v<N>/), so there is no module list here.

deployment_settings:
  workspace: "YOUR_WORKSPACE_ID_HERE" # set by `stacksync workflow-connector create`
  region: "usnv" # "usnv" or "besg"

app_settings:
  app_type: "my_app" # stable id: lowercase letters, numbers, underscores only (e.g. my_crm)
  app_name: "My App" # human-readable name shown in the workflow builder
  app_type_display: "My App"
  app_icon_svg_url: "" # required: a stable https:// link to your app's SVG logo, shown in the workflow builder
  app_description: "A concise description of your app and its capabilities."
  # The connection users pick for every module. Exactly one of:
  #   generic_api_credentials  the user pastes one string (API key, token, or JSON)
  #   <your app_type>          a native connection Stacksync set up for your app
  connection_app_type: "generic_api_credentials"
